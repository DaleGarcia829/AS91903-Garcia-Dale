<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic page setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CSS style sheet link -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- JavaScript file link -->
    <script src="https://jquery.com" defer></script>
    
    <!-- Google Fonts links -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link href="https://googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://googleapis.com/css2?family=New+Amsterdam&display=swap" rel="stylesheet">
    
    <!-- Title on the browser tab -->
    <title>Hotel Shaggy - Booking</title>
</head>
<body>
    <!-- Top bar with logo and menu -->
    <header>
            <!-- Website Logo -->
            <a href="index.html"><img id="logo" src="images/logo.png" alt="Hotel Logo"/></a>
            <div class="topnav">
            <!-- Navigation links -->
            <nav>
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="rooms.html">ROOMS</a></li>
                    <li><a href="contact.html">CONTACT US</a></li>
                </ul>
            </nav>
            </div>
    <!-- Main content starts here -->
    <main>
        <!-- Big main title text -->
        <p id="p1">Book Your <br>Stay</p>
    
    <!-- Main white section for the form -->
    <section id="bottomnavdivision">
        <p id="p2">RESERVATION FORM</p>
            
        <p id="p3" style="text-align: center; margin-bottom: 50px;">
            Please fill out the Google Form below to reserve your room at Hotel Shaggy. 
            Our team will process your request and send a confirmation email shortly!
        </p>

        <!-- Container to center your Google Form on the page -->
        <div style="display: flex; justify-content: center; width: 100%;">
            
            <!-- Your live Google Form embedded right into the layout -->
            <iframe src="https://google.com" width="700" height="900" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>

        </div>
    
    </section>

    <!-- Footer with social media links and icons -->
    <footer>
            <section id="footr">
            <!-- Copyright text -->
            <p id="p4">©2026 <b>GARCIA HOTELS GROUP Ltd. </b> All rights reserved. </p>
            <!-- Social media icon buttons -->
            <a href="https://telegram.org"><img id="icon" src="images/email_icon.png" alt="The Telegram logo"/></a>
            <a href="https://facebook.com"><img id="icon" src="images/facebook_icon.png" alt="The Facebook logo"/></a>
            <a href="https://instagram.com"><img id="icon" src="images/instagram_icon.png" alt="The Instagram logo"/></a>
            
        </footer>

    </main>
</body>
</html>
